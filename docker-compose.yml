services:
  backend:
    build:
      context: ./backend
    image: loanwise-backend:local
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-loanuser}:${MYSQL_PASSWORD:-change_this_password}@db:3306/${MYSQL_DATABASE:-loanwise}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [loanwise-net]

  frontend:
    build:
      context: ./frontend
    image: loanwise-frontend:local
    ports:
      - "8080:80"
    depends_on: [backend]
    restart: unless-stopped
    networks: [loanwise-net]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loanwise}
      MYSQL_USER: ${MYSQL_USER:-loanuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [loanwise-net]

volumes:
  mysql_data:
networks:
  loanwise-net:
    driver: bridge